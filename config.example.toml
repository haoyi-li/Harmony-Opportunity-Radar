# ============================================================
# 鸿蒙机会雷达 配置模板
# 用法: 复制本文件为 config.toml 后按需修改（config.toml 不入库）
# ============================================================

[llm]
# OpenAI 兼容接口（本地 vLLM / Ollama / 商用中转均可无缝切换）
base_url = "http://localhost:8000/v1"   # 本地 vLLM 默认地址
api_key  = "EMPTY"                      # 本地部署随便填，商用中转填真实 key
model    = "qwen2.5-coder-32b"          # 打样用本地模型，出结果前换商用精修
timeout  = 120                          # 秒，本地大模型响应偏慢，给足余量

[capture]
# ---- Apple 标杆捕获（M1）----
regions = ["cn", "us"]              # 拉哪些地区的榜单
charts  = ["top-free", "top-paid"]  # 拉哪些榜单类型
feed_limit = 200                     # 每个榜单拉取条数（上限 200，全量目录入库）
max_benchmarks = 20                  # LLM 精选后保留的标杆数量上限
llm_input_limit = 200                # 送入 LLM 的应用条数上限
rss_retries = 3                      # RSS 拉取重试次数
enrich_itunes = true                 # 用 iTunes lookup 补齐 genre/评分/描述等详情

[probe]
# ---- 鸿蒙供给探测（M2）----
max_comments_per_app = 50            # 每个竞品最多抓多少条评论
bad_rating_threshold = 3             # rating <= 该值视为中差评
max_competitors = 3                  # 每个标杆最多保留几个真实竞品
max_keywords_per_benchmark = 4       # 每个标杆最多用几个关键词检索
comment_pages = 4                    # 每个竞品最多抓几页评论
filter_candidates_limit = 8          # 送 LLM 语义判定的候选上限
enable_llm_filter = true             # 关闭则退化为按下载量/评分排序

[database]
# ---- 本地增量数据库（核心数据资产）----
path = "data/apps.db"                # 原始仓库：capture / probe 写入
decisions_path = "data/decisions.db" # 产物库：filter 裁决与知识模式
refresh_threshold_days = 30          # 超过 N 天未 probe 标记为「待刷新」
auto_clean_days = 0                  # 自动清理 N 天未出现的应用（0=禁用）

[filter]
# ---- AI 增量筛选（只裁决未分析或依据失效的应用）----
max_apps = 300                       # 单次最多处理多少个待裁决应用
batch_size = 50                      # 每次 LLM 调用包含多少个应用
verdict_ttl_days = 90                # 裁决兜底有效期（天）
enable_criteria_hash = false         # 提示词/模型变化时是否强制重判
